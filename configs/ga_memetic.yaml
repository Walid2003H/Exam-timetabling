# Configuration for Memetic Genetic Algorithm solver 'ga_memetic' (P5)
defaults:
  pop_size: 24
  tournament_size: 3
  crossover_rate: 0.85
  crossover_type: uniform
  mutation_rate: 0.04
  elitism_count: 2
  dsatur_init_ratio: 0.35
  constraint_handling: repair
  max_repair_passes: 3
  penalty_weight: 1000.0
  stagnation_generations: 14
  use_local_search: true
  ls_operator: hybrid
  ls_max_passes: 1
  ls_kempe_steps: 12
  ls_swap_trials: 12

search_space:
  pop_size: [16, 24, 32]
  tournament_size: [2, 3, 4]
  crossover_rate: [0.80, 0.90]
  mutation_rate: [0.02, 0.04, 0.06]
  ls_operator: [move, kempe, hybrid]
  ls_kempe_steps: [10, 15, 25]
