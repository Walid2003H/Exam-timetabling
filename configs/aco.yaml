# Configuration for pure MAX-MIN Ant System solver 'aco' (P7)
defaults:
  n_ants: 16
  alpha: 1.0
  beta: 2.5
  rho: 0.12
  q0: 0.15
  p_best: 0.05
  gbest_deposit_freq: 3
  constraint_handling: repair
  max_repair_passes: 3
  penalty_weight: 1000.0
  stagnation_iters: 14
  smooth_factor: 0.35
  use_local_search: false

search_space:
  n_ants: [10, 16, 24]
  alpha: [0.8, 1.0, 1.5]
  beta: [1.5, 2.5, 3.5]
  rho: [0.08, 0.12, 0.20]
  q0: [0.05, 0.15, 0.30]
